<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Funnel Analytics — Learn</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fbfcfe;
    --ink:#161922; --muted:#616b7a; --faint:#8a93a3;
    --line:#e6e9ef; --line-2:#eef1f6;
    --accent:#4c63e6; --accent-ink:#3547c4; --accent-soft:#eaeeff;
    --amber:#b7791f; --amber-soft:#fdf4e3;
    --green:#2f855a; --green-soft:#e6f6ec;
    --red:#c53030; --red-soft:#fdeaea;
    --code-bg:#1c2030; --code-ink:#e7ebf5; --code-kw:#9db4ff;
    --code-str:#9ae6b4; --code-com:#7f8aa3; --code-num:#f6ad9c;
    --ring-track:#e6e9ef;
    --shadow:0 1px 2px rgba(20,25,34,.04),0 4px 16px rgba(20,25,34,.05);
  }
  :root[data-theme="dark"]{
    --bg:#0d0f14; --panel:#151821; --panel-2:#12141c;
    --ink:#e9ecf2; --muted:#9aa3b2; --faint:#6b7484;
    --line:#242835; --line-2:#1d212c;
    --accent:#7d92ff; --accent-ink:#9fb0ff; --accent-soft:#1b2138;
    --amber:#e0b155; --amber-soft:#2a2416;
    --green:#68d391; --green-soft:#16261c;
    --red:#fc8181; --red-soft:#2a1717;
    --code-bg:#0a0c12; --code-ink:#e7ebf5; --code-kw:#9db4ff;
    --code-str:#9ae6b4; --code-com:#6b7591; --code-num:#f6ad9c;
    --ring-track:#242835;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d0f14; --panel:#151821; --panel-2:#12141c;
      --ink:#e9ecf2; --muted:#9aa3b2; --faint:#6b7484;
      --line:#242835; --line-2:#1d212c;
      --accent:#7d92ff; --accent-ink:#9fb0ff; --accent-soft:#1b2138;
      --amber:#e0b155; --amber-soft:#2a2416;
      --green:#68d391; --green-soft:#16261c;
      --red:#fc8181; --red-soft:#2a1717;
      --code-bg:#0a0c12; --code-ink:#e7ebf5; --code-kw:#9db4ff;
      --code-str:#9ae6b4; --code-com:#6b7591; --code-num:#f6ad9c;
      --ring-track:#242835;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-ink)}
  /* ---------- layout ---------- */
  .app{display:grid; grid-template-columns:288px 1fr; min-height:100vh}
  .sidebar{
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--line);
    padding:22px 16px; display:flex; flex-direction:column; gap:14px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:2px 6px 8px}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#8a5cf6);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  }
  .brand b{font-size:15px;letter-spacing:-.01em;display:block;line-height:1.2}
  .brand small{color:var(--faint);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .side-progress{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .side-progress .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}
  .bar{height:7px;border-radius:99px;background:var(--ring-track);overflow:hidden}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8a5cf6);border-radius:99px;transition:width .4s ease}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:2px}
  nav .nav-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:10px 10px 4px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
    color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer;border:1px solid transparent;
  }
  .nav-item:hover{background:var(--panel-2)}
  .nav-item.active{background:var(--accent-soft);border-color:var(--line);color:var(--accent-ink);font-weight:600}
  .nav-item .ix{width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
  .nav-item.active .ix{background:var(--accent);color:#fff;border-color:transparent}
  .nav-item .tick{margin-left:auto;color:var(--green);font-size:13px;opacity:0}
  .nav-item.done .tick{opacity:1}
  .side-foot{margin-top:auto;display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--line-2)}
  .ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .ghost:hover{color:var(--ink)}
  /* ---------- main ---------- */
  main{padding:0;min-width:0}
  .content{max-width:820px;margin:0 auto;padding:44px 32px 120px;min-width:0}
  .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
  h1.page{font-size:34px;line-height:1.12;letter-spacing:-.02em;margin:10px 0 8px}
  .sub{color:var(--muted);font-size:17px;margin:0 0 26px;max-width:62ch}
  h2.sec{font-size:22px;letter-spacing:-.01em;margin:38px 0 12px;padding-top:8px}
  h3.sub-h{font-size:16px;margin:26px 0 10px;color:var(--ink)}
  p{margin:0 0 14px}
  .content ul,.content ol{margin:0 0 16px;padding-left:22px}
  .content li{margin:6px 0}
  .lead{font-size:16px}
  /* cards / callouts */
  .concept{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px 20px 18px;margin:16px 0;box-shadow:var(--shadow);position:relative;
  }
  .concept .c-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .concept .c-emoji{font-size:19px;line-height:1.3}
  .concept h3{margin:0;font-size:16.5px}
  .concept .read-btn{
    margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .concept.read{border-color:var(--green)}
  .concept.read .read-btn{background:var(--green-soft);color:var(--green);border-color:var(--green)}
  .callout{border-radius:12px;padding:15px 17px;margin:16px 0;border:1px solid var(--line);background:var(--panel-2)}
  .callout .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .callout p:last-child{margin-bottom:0}
  .callout.turn{background:var(--amber-soft);border-color:var(--amber)}
  .callout.turn .k{color:var(--amber)}
  .callout.warn{background:var(--red-soft);border-color:var(--red)}
  .callout.warn .k{color:var(--red)}
  .callout.tip{background:var(--accent-soft);border-color:var(--accent)}
  .callout.tip .k{color:var(--accent-ink)}
  .checkpoint{background:var(--green-soft);border:1px solid var(--green);border-radius:12px;padding:16px 18px;margin:22px 0}
  .checkpoint .k{color:var(--green);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .checkpoint .done-btn{margin-top:12px;background:var(--green);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
  .checkpoint.is-done .done-btn{background:var(--panel);color:var(--green);border:1px solid var(--green)}
  /* code */
  figure.code{margin:16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
  figure.code figcaption{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07)}
  figure.code .lang{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#aeb8d4;background:rgba(255,255,255,.07);padding:2px 8px;border-radius:6px}
  figure.code .cap{font-size:12px;color:#aeb8d4}
  figure.code .copy{margin-left:auto;background:rgba(255,255,255,.08);color:#dfe5f5;border:none;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
  figure.code .copy:hover{background:rgba(255,255,255,.16)}
  figure.code pre{margin:0;padding:15px 16px;overflow-x:auto}
  figure.code code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.62;color:var(--code-ink);white-space:pre}
  .kw{color:var(--code-kw)} .str{color:var(--code-str)} .com{color:var(--code-com);font-style:italic} .num{color:var(--code-num)}
  code.inline{background:var(--accent-soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--accent-ink)}
  /* reveal */
  details.reveal{border:1px solid var(--line);border-radius:12px;margin:16px 0;background:var(--panel);overflow:hidden}
  details.reveal>summary{list-style:none;cursor:pointer;padding:14px 17px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--accent-ink)}
  details.reveal>summary::-webkit-details-marker{display:none}
  details.reveal>summary .chev{transition:transform .2s;color:var(--muted)}
  details.reveal[open]>summary .chev{transform:rotate(90deg)}
  details.reveal>summary .rl{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--amber);background:var(--amber-soft);padding:3px 8px;border-radius:6px;border:1px solid var(--amber)}
  .reveal-body{padding:2px 18px 18px;border-top:1px solid var(--line-2)}
  .reveal-body>*:first-child{margin-top:14px}
  /* diagrams */
  figure.diagram{margin:20px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  figure.diagram svg{width:100%;height:auto;display:block}
  figure.diagram figcaption{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}
  /* tables */
  .tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
  table.data{border-collapse:collapse;width:100%;font-size:13.5px}
  table.data th,table.data td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line-2)}
  table.data th{background:var(--panel-2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  table.data tr:last-child td{border-bottom:none}
  /* dashboard */
  .dash-hero{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:26px}
  .ring{position:relative;width:180px;height:180px;margin:0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .rc{fill:none;stroke:var(--ring-track);stroke-width:14}
  .ring .rp{fill:none;stroke:url(#g);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
  .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .ctr b{font-size:34px;letter-spacing:-.02em;line-height:1}
  .ring .ctr span{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
  .hero-stats{display:flex;flex-direction:column;gap:14px}
  .hero-stats h2{margin:0 0 2px;font-size:20px}
  .stat-row{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{font-size:22px;display:block;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted)}
  .cont-btn{align-self:flex-start;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .mod-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
  .mod-card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .mod-card .mc-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .mod-card .mc-ix{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent-soft);color:var(--accent-ink)}
  .mod-card.done .mc-ix{background:var(--green);color:#fff}
  .mod-card .pill{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
  .pill.ns{background:var(--panel-2);color:var(--faint);border:1px solid var(--line)}
  .pill.ip{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
  .pill.dn{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
  .mod-card h3{margin:0 0 4px;font-size:15px}
  .mod-card p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .mod-card .mc-bar{height:6px;border-radius:99px;background:var(--ring-track);overflow:hidden}
  .mod-card .mc-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8a5cf6)}
  .mod-card .mc-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:7px}
  /* module footer nav */
  .mod-nav{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
  .mod-nav a{flex:1;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:var(--panel);color:var(--ink)}
  .mod-nav a:hover{border-color:var(--accent)}
  .mod-nav a.nx{text-align:right}
  .mod-nav small{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block}
  .mod-nav b{font-size:14px}
  /* time chip */
  .side-time{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .side-time b{color:var(--ink);font-variant-numeric:tabular-nums}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle}
  .live-dot.idle{background:var(--faint)}
  /* notes editor */
  .notes-toolbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;padding:8px}
  .notes-toolbar button{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;line-height:1;cursor:pointer;color:var(--ink);min-width:32px}
  .notes-toolbar button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  .nt-sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  .notes-editor{background:var(--panel);border:1px solid var(--line);border-radius:0 0 12px 12px;padding:22px;min-height:360px;font-size:15px;line-height:1.7;outline:none;color:var(--ink)}
  .notes-editor:focus{border-color:var(--accent)}
  .notes-editor:empty::before{content:"Start typing your notes…";color:var(--faint)}
  .notes-editor h2{font-size:20px;margin:14px 0 8px}
  .notes-editor h3{font-size:16px;margin:14px 0 6px}
  .notes-editor ul,.notes-editor ol{padding-left:24px;margin:8px 0}
  .notes-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
  .notes-foot #nt-status{font-size:12px;color:var(--muted)}
  .notes-actions{display:flex;gap:8px;flex-wrap:wrap}
  /* SQL playground */
  .sql-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
  .sql-run{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
  .sql-run:disabled{opacity:.5;cursor:default}
  .sql-status{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
  .sql-input{width:100%;min-height:190px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13.5px;line-height:1.6;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--code-bg);color:var(--code-ink);outline:none;resize:vertical;tab-size:2}
  .sql-input:focus{border-color:var(--accent)}
  .sql-out{margin-top:16px}
  .sql-ok{color:var(--green);font-size:13px;font-weight:600;margin-bottom:8px}
  .sql-err{color:var(--red);background:var(--red-soft);border:1px solid var(--red);border-radius:10px;padding:12px 14px;font-family:monospace;font-size:13px;white-space:pre-wrap}
  .sql-msg{color:var(--muted);font-size:13px}
  table.data.sql-res td{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;white-space:nowrap}
  .sql-hint{font-size:12px;color:var(--faint);margin-top:6px}
  .topbar{display:none}
  /* mobile */
  .scrim{display:none}
  @media (max-width:880px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;z-index:40;width:280px;transform:translateX(-100%);transition:transform .25s}
    .sidebar.open{transform:none}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
    .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
    .topbar button{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink)}
    .topbar b{font-size:14px}
    .content{padding:26px 18px 100px}
    .dash-hero{grid-template-columns:1fr;text-align:center}
    h1.page{font-size:27px}
  }
</style>
</head>
<body>
<div class="topbar">
  <button id="burger" aria-label="Menu">☰</button>
  <b>Funnel Analytics</b>
</div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">FA</div>
      <div><b>Funnel Analytics</b><small>Learn &amp; Build</small></div>
    </div>
    <div class="side-progress">
      <div class="lab"><span>Course progress</span><span id="sp-pct">0%</span></div>
      <div class="bar"><span id="sp-bar" style="width:0%"></span></div>
      <div class="side-time">
        <span><span class="live-dot" id="sp-dot"></span>Time on app <b id="sp-time">0s</b></span>
        <span>today <b id="sp-time-today">0s</b></span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="ghost" id="theme-btn">◐ Theme</button>
      <button class="ghost" id="reset-btn">↺ Reset</button>
    </div>
  </aside>
  <main><div class="content" id="view"></div></main>
</div>

<script>
/* =====================================================================
   Marketing Funnel Analytics — in-app learning course
   Self-contained. Progress persists in localStorage.
   ===================================================================== */

/* ---------- tiny syntax highlighter (single-pass, safe) ---------- */
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const SQL_RE=/(--[^\n]*)|('(?:[^']|'')*')|\b(SELECT|FROM|WHERE|GROUP\s+BY|ORDER\s+BY|LEFT|RIGHT|INNER|OUTER|JOIN|ON|AS|AND|OR|NOT|NULL|IS|IN|LIKE|ILIKE|COUNT|DISTINCT|SUM|AVG|MIN|MAX|ROUND|CASE|WHEN|THEN|ELSE|END|FILTER|WITH|CREATE|TABLE|PRIMARY|KEY|REFERENCES|INTEGER|TEXT|TIMESTAMP|NUMERIC|DATE|COPY|FORMAT|HEADER|HAVING|LIMIT|INTERVAL|EXTRACT|EPOCH|date_trunc|true|false)\b|\b(\d+\.?\d*)\b/gi;
const PY_RE=/(#[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(import|from|for|in|if|elif|else|def|return|global|while|with|as|and|or|not|None|True|False|lambda|continue|break|pass)\b|\b(random|datetime|timedelta|range|int|float|round|open|print|len|min|max|str|list|dict)\b|\b(\d+\.?\d*)\b/g;
function highlight(code,lang){
  const e=esc(code);
  if(lang==='python'){
    return e.replace(PY_RE,(m,com,s,kw,bi,num)=>{
      if(com)return `<span class="com">${com}</span>`;
      if(s)return `<span class="str">${s}</span>`;
      if(kw)return `<span class="kw">${kw}</span>`;
      if(bi)return `<span class="kw" style="opacity:.85">${bi}</span>`;
      if(num)return `<span class="num">${num}</span>`;
      return m;
    });
  }
  return e.replace(SQL_RE,(m,com,s,kw,num)=>{
    if(com)return `<span class="com">${com}</span>`;
    if(s)return `<span class="str">${s}</span>`;
    if(kw)return `<span class="kw">${kw}</span>`;
    if(num)return `<span class="num">${num}</span>`;
    return m;
  });
}
function code(lang,src,cap){
  const raw=encodeURIComponent(src);
  return `<figure class="code"><figcaption><span class="lang">${lang}</span>${cap?`<span class="cap">${cap}</span>`:''}<button class="copy" data-code="${raw}">Copy</button></figcaption><pre><code>${highlight(src,lang)}</code></pre></figure>`;
}
function callout(kind,label,emoji,html){
  return `<div class="callout ${kind}"><div class="k">${emoji} ${label}</div>${html}</div>`;
}
function reveal(title,html){
  return `<details class="reveal"><summary><span class="chev">▶</span>${title}<span class="rl">Try first</span></summary><div class="reveal-body">${html}</div></details>`;
}

const MODULES=[
{num:'0',title:'Setup',time:'35 min',tag:'Understand your tools, then get them running',
 concepts:[
  concept('🗄️','What a database is — and what SQL is',
   `<p>You've used spreadsheets. A <b>database</b> is the grown-up version: it stores data in <b>tables</b> (rows and columns, exactly like a spreadsheet tab), but it can hold millions of rows, enforce rules ("this column must be a date"), and — crucially — let you <i>ask questions</i> that would be impossible to click together in Excel.</p>
    <p><b>SQL</b> (say "sequel" or "ess-cue-el") is the language you ask those questions in. It reads almost like English:</p>
    ${code('sql',"SELECT channel, COUNT(*)\nFROM leads\nWHERE region = 'EMEA'\nGROUP BY channel;",'"How many leads per channel, but only for EMEA?"')}
    <p>That's the whole job of this project: put marketing data into tables, then write SQL questions against it. You are not "coding" in the scary sense — you're describing <i>what you want</i> and letting the database figure out how to get it.</p>
    <p><b>PostgreSQL</b> (or "Postgres") is the specific database program we use. It's free, open-source, and the one you'll see most often in real analyst job postings — so it's worth having on your résumé by name.</p>`),
  concept('💬','What is psql? (PostgreSQL vs. the tool that talks to it)',
   `<p>This trips up nearly everyone, because two things share the word "Postgres." They are <b>not</b> the same:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Name</th><th>What it is</th><th>Analogy</th></tr>
      <tr><td><b>PostgreSQL</b></td><td>the <b>database itself</b> — it stores your data and does the work</td><td>the kitchen</td></tr>
      <tr><td><b>psql</b></td><td>a little <b>text tool for talking to</b> PostgreSQL by typing</td><td>a plain paper order pad</td></tr>
    </table></div>
    <p>The name is literally <b>"PostgreSQL" + "client"</b> → <code class="inline">psql</code>. When you type <code class="inline">psql marketing_funnel</code> in Terminal, you launch this tool and point it at your database. The prompt then becomes <code class="inline">marketing_funnel=#</code>, and whatever SQL you type gets carried to PostgreSQL and answered.</p>
    <p>Three things that make it click:</p>
    <ul>
      <li>You did <b>not</b> install <code class="inline">psql</code> separately — it came <b>bundled with PostgreSQL</b>. One install, two pieces: the database, and the tool to talk to it.</li>
      <li><code class="inline">psql</code> is <i>not the only</i> way in. The TablePlus app does the exact same job with a nice clickable window. <code class="inline">psql</code> is the <b>text</b> version; TablePlus is the <b>graphical</b> version. Both are "clients" talking to the same PostgreSQL.</li>
      <li><code class="inline">psql --version</code> just asks the tool "what version are you?" — which is why it also serves as your "is Postgres installed?" check.</li>
    </ul>
    ${callout('tip','One line to remember','📌',`<p>PostgreSQL is the <b>database</b>; <code class="inline">psql</code> is the little <b>typing tool</b> you use to talk to it.</p>`)}`),
  concept('🔌','Client vs. server — the shape of every database',
   `<p>A database has two halves, and knowing the split will save you an hour of confusion later.</p>
    <p><b>Restaurant analogy.</b> The <b>server</b> is the kitchen: it runs in the back, holds all the ingredients (your data), and does the actual work. The <b>client</b> is the waiter: it takes your order (your SQL), carries it to the kitchen, and brings back the plate (your results). You never walk into the kitchen — you talk to the waiter.</p>
    <ul>
      <li>The <b>server</b> here is PostgreSQL running in the background. It must be <i>started</i> for anything to work — a closed kitchen serves no one. That's why Step 1 below is "start the server."</li>
      <li>The <b>client</b> is whatever you type into: <code class="inline">psql</code> (the text tool from the card above) or a point-and-click app like TablePlus. You can have many clients talking to one server.</li>
    </ul>
    <p>Nearly every real database — Postgres, MySQL, Snowflake, BigQuery — works this way. Interviewers like to hear you name the split.</p>`)
 ],
 body:`
  <p class="lead">Great news: PostgreSQL and Python are <b>already installed</b> on your Mac, so you skip the painful part. This module is about <i>understanding</i> the tools (above) and getting the database running (below). If a step throws an error, read the troubleshooting note under it — most first-timers hit one of these.</p>

  <h2 class="sec">Wait — where do I actually type all this?</h2>
  <p>This is the question that trips up almost everyone, so let's kill the confusion before you run a single command. Right now you probably have <b>Claude Code open in one window</b> (where you chat with the AI) and <b>this course open in a browser</b>. Here's the key point:</p>
  ${callout('warn','The commands below do NOT go into the Claude Code chat','⚠️',`<p>The Claude Code window is for <i>talking to the AI in plain English</i>. The database commands (<code class="inline">psql</code>, <code class="inline">createdb</code>, etc.) go into a <b>separate app called Terminal</b> that you open yourself and control directly. Keep them separate — that way your hands-on work is clean and it's <i>you</i> driving the database, which is the whole point of learning it.</p>`)}
  <p>Across this project you'll type into <b>four different places</b>. They look different and expect different things. Here's the full map — bookmark it mentally:</p>
  <div class="tbl-wrap"><table class="data">
    <tr><th>Place</th><th>How you open it</th><th>The prompt looks like…</th><th>What you type here</th></tr>
    <tr><td><b>Claude Code</b> (the AI chat)</td><td>already open</td><td>a message box</td><td>plain-English requests to the AI</td></tr>
    <tr><td><b>Terminal</b> (your workspace)</td><td><code class="inline">Cmd + Space</code> → type "Terminal" → Enter</td><td><code class="inline">priya@MacBook ~ %</code></td><td>shell commands: <code class="inline">psql</code>, <code class="inline">createdb</code>, <code class="inline">python3</code>, <code class="inline">git</code></td></tr>
    <tr><td><b>Inside psql</b> (the database)</td><td>run <code class="inline">psql marketing_funnel</code> <i>in</i> Terminal</td><td><code class="inline">marketing_funnel=#</code></td><td>SQL queries and <code class="inline">\\</code> commands</td></tr>
    <tr><td><b>GUI client</b> (later, optional)</td><td>open the TablePlus app</td><td>a query editor box</td><td>SQL queries</td></tr>
  </table></div>
  <p><b>The single most useful skill:</b> glance at the <b>prompt</b> (the text at the start of the line) to know where you are. If it ends in <code class="inline">%</code> or <code class="inline">$</code>, you're in the plain Terminal. If it says <code class="inline">marketing_funnel=#</code>, you're inside the database and it's expecting SQL. Mixing these up — typing SQL at the <code class="inline">%</code> prompt, or <code class="inline">psql</code> inside psql — is the #1 beginner stumble.</p>

  <h2 class="sec">Open your Terminal now — step by step</h2>
  <ol>
    <li>Press <code class="inline">Cmd + Space</code> to open Spotlight (a search bar appears mid-screen).</li>
    <li>Type <b>Terminal</b> and press <b>Enter</b>. A plain window opens with a prompt like <code class="inline">priya@MacBook ~ %</code>.</li>
    <li>That's it — this is <b>your window for the whole project</b>. Keep it open next to this course page. You do <i>not</i> need a new window for every command; reuse this one.</li>
    <li>Only if a command is still running and you want to do something else: press <code class="inline">Cmd + T</code> for a new <b>tab</b> in the same window (or <code class="inline">Cmd + N</code> for a whole new window).</li>
  </ol>
  <p>Three rules for the Terminal and you're fluent enough:</p>
  <ul>
    <li>Type a command, press <b>Enter</b> to run it.</li>
    <li>A command that finishes with <b>no message</b> usually <i>worked</i>. Errors are loud.</li>
    <li>Don't type the <code class="inline">$</code> or <code class="inline">%</code> — that's the prompt the computer prints, not part of your command.</li>
  </ul>

  <h2 class="sec">1 · Start the database server</h2>
  <p>Back to the kitchen/waiter split: the <b>server</b> (PostgreSQL) is the kitchen that holds your data and does the work, and it has to be <i>running</i> before anyone can order anything. Two things surprise beginners here: installing Postgres did <i>not</i> automatically start it, and even once you start it, it shuts down when you reboot your Mac. So Step 1 is simply "open the kitchen." <b>In your Terminal window</b> (the one whose prompt ends in <code class="inline">%</code>), type these two lines, pressing Enter after each:</p>
  ${code('bash','psql --version\nbrew services start postgresql@16','Type this in your Terminal window (not the Claude Code chat)')}
  <p><b>Line 1 · <code class="inline">psql --version</code></b> asks the psql tool to print which version it is. It doubles as your "is Postgres even installed?" check. You should see something like this printed back:</p>
  ${code('bash','psql (PostgreSQL) 16.2','What Postgres prints back — a version number means it is installed')}
  <p>If instead you see <code class="inline">command not found</code>, Postgres isn't installed or isn't on your PATH (the troubleshooting note handles that).</p>
  <p><b>Line 2 · <code class="inline">brew services start postgresql@16</code></b> starts the kitchen. <b>Homebrew</b> (<code class="inline">brew</code>) is the app that installed Postgres for you, and its "services" feature keeps background programs running. This line tells Homebrew to start the Postgres server now <i>and</i> to restart it automatically every time you reboot — so this is a one-time thing. Success looks like:</p>
  ${code('bash','==> Successfully started postgresql@16','The kitchen is now open, and will re-open itself after reboots')}
  <p>Any time you want to double-check the server is running, <code class="inline">brew services list</code> shows every service and whether its status says <code class="inline">started</code>.</p>
  ${callout('warn','If that errors','⚠️',`<p>If <code class="inline">brew services start postgresql@16</code> says "No available formula," your version number differs. Run <code class="inline">brew services list</code> to see the real name (e.g. <code class="inline">postgresql@17</code>) and use that. If <code class="inline">psql</code> is "command not found," Postgres isn't on your PATH — run <code class="inline">brew install postgresql@16</code> and try again.</p>`)}

  <h2 class="sec">2 · Create your project database</h2>
  <p>The server is running, but right now it's an <i>empty</i> kitchen — there's no data and, in fact, no database of our own yet. A single Postgres server can hold <b>many separate databases</b>, like many labelled binders in one filing cabinet. Giving this project its own binder means nothing you do here can collide with anything else on your machine, and you can wipe it and start over without touching anything else. <b>Still in the same Terminal window</b> (prompt still ends in <code class="inline">%</code>), run:</p>
  ${code('bash','createdb marketing_funnel','Creates a new, empty database named marketing_funnel')}
  <p><code class="inline">createdb</code> is a small command that makes one brand-new, empty database with the name you give it. Here's a thing that trips people up: when it works, it prints <b>nothing at all</b> and just drops you back at the <code class="inline">%</code> prompt. In the terminal, <b>silence usually means success</b> — no news is good news. Now connect to the database you just made:</p>
  ${code('bash','psql marketing_funnel','Launches the psql tool and connects it to your new database')}
  <p>This launches the psql tool (from the concept card above) and points it at your <code class="inline">marketing_funnel</code> database. You'll see a short welcome banner, and then — the part that matters — <b>your prompt changes</b>:</p>
  ${code('bash','priya@MacBook ~ %       <-- BEFORE: the plain Terminal (the shell)\nmarketing_funnel=#      <-- AFTER: you are now INSIDE psql','Your prompt is a you-are-here sign — glance at it constantly')}
  <p>That <code class="inline">marketing_funnel=#</code> is psql announcing: "you're inside the database now, and I'm expecting SQL." (The <code class="inline">=#</code> is just psql's prompt style; the part before it is your database's name.) This tiny detail is the single most useful habit in the whole setup — <b>the prompt always tells you which of the two places you're typing into.</b></p>
  <p>Now try these three commands, one at a time. Two of them are <i>psql shortcuts</i> (they begin with a backslash and take <b>no</b> semicolon); the third is <i>real SQL</i> (and every SQL statement ends with a semicolon):</p>
  <div class="tbl-wrap"><table class="data">
    <tr><th>Type this</th><th>What it does</th><th>What you'll see</th></tr>
    <tr><td><code class="inline">\\dt</code></td><td>Lists the tables in this database</td><td><code class="inline">Did not find any relations.</code> — that's correct, you haven't built tables yet!</td></tr>
    <tr><td><code class="inline">SELECT 1;</code></td><td>A trivial SQL query (note the semicolon)</td><td>A little two-line table showing the value <code class="inline">1</code> — proof the database understands SQL.</td></tr>
    <tr><td><code class="inline">\\q</code></td><td>Quits psql, back to the Terminal</td><td>Your prompt returns to <code class="inline">%</code>.</td></tr>
  </table></div>
  <p><b>Why the semicolon matters.</b> A single SQL statement can span many lines, so psql waits for a <code class="inline">;</code> to know you're done. If you press Enter without one, the prompt changes to <code class="inline">marketing_funnel-#</code> (note the <b>dash</b> instead of <code class="inline">=</code>) — that's psql quietly saying "I'm still waiting for the rest of your statement." Don't panic: just type <code class="inline">;</code> and Enter. Backslash commands like <code class="inline">\\dt</code> are psql's own shortcuts, not SQL, which is why they don't take a semicolon.</p>
  ${callout('warn','If that errors','⚠️',`<p><code class="inline">database "marketing_funnel" already exists</code> just means you ran it twice — harmless, skip straight to <code class="inline">psql marketing_funnel</code>. <code class="inline">role "yourname" does not exist</code> means Postgres has no user matching your Mac account — run <code class="inline">createuser -s $(whoami)</code> once, then retry.</p>`)}

  <h2 class="sec">3 · Get a friendly window (strongly recommended)</h2>
  <p>psql works, but typing long queries into it gets painful fast — no easy scrolling, no colors, results shown as cramped text. A <b>GUI client</b> is a separate app that does the <i>exact same job</i> (it's just another client — another waiter talking to the same kitchen) but with a proper editor and results shown as a clean, clickable grid. Installing one makes the whole project noticeably more pleasant, and it's what you'd actually use on the job. Pick one:</p>
  <div class="tbl-wrap"><table class="data">
    <tr><th>Option</th><th>Notes</th></tr>
    <tr><td><b>TablePlus</b> — tableplus.com</td><td>Easiest to learn. The free tier is plenty for this project.</td></tr>
    <tr><td><b>DBeaver</b> — dbeaver.io</td><td>Completely free and open-source; a little busier to look at.</td></tr>
  </table></div>
  <p>Download one, open the downloaded file, and drag the app into your <b>Applications</b> folder. Open it and create a new <b>PostgreSQL</b> connection. Each field below just tells the client <i>which</i> kitchen to talk to — this is the client/server split made concrete:</p>
  <div class="tbl-wrap"><table class="data">
    <tr><th>Field</th><th>Value</th><th>What it means</th></tr>
    <tr><td>Host</td><td><code class="inline">localhost</code></td><td>"the database is on this same computer"</td></tr>
    <tr><td>Port</td><td><code class="inline">5432</code></td><td>the default "door number" Postgres listens on</td></tr>
    <tr><td>Database</td><td><code class="inline">marketing_funnel</code></td><td>which binder to open</td></tr>
    <tr><td>User</td><td>your Mac username</td><td>who's connecting</td></tr>
    <tr><td>Password</td><td>leave blank</td><td>local Postgres trusts your Mac account</td></tr>
  </table></div>
  <p>Click Connect. To prove it works, open a query tab and run <code class="inline">SELECT 1;</code> — you should get a grid with a single cell showing <code class="inline">1</code>. Same query, same database as in psql, just a friendlier window. This is your home for the rest of the project.</p>

  <h2 class="sec">4 · Save your progress with Git</h2>
  <p><b>Git</b> is a "save point" system for your files. Each save (called a <b>commit</b>) is a labelled snapshot you can always return to, and pushing sends a copy up to <b>GitHub</b> so your work is backed up online and can't be lost. The good news: your project folder is <i>already</i> a git repository, so there's nothing to set up — you just save as you go. You don't need to master git; these three commands, run in Terminal from your project folder, cover everything:</p>
  ${code('bash','git add -A\ngit commit -m "Describe what you just did"\ngit push')}
  <p>Reading them left to right: <code class="inline">git add -A</code> gathers up every file you changed; <code class="inline">git commit -m "..."</code> saves a snapshot with a short note to your future self; <code class="inline">git push</code> uploads that snapshot to GitHub. Run this little loop whenever you finish something meaningful — a working data generator, a query you're proud of — so you can always get back to a version that worked.</p>

  ${callout('turn','Your turn — prove the whole chain works','✍️',`<p>Before leaving this module: start the server, open your GUI client, connect to <code class="inline">marketing_funnel</code>, and run <code class="inline">SELECT 1;</code>. Seeing a result grid with a single <code class="inline">1</code> in it means the kitchen is open, the waiter is connected, and you're ready to build. If it fails, the error almost always matches a troubleshooting note above.</p>`)}
 `,
