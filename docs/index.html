{num:'1',title:'The mental model',time:'40 min',tag:'The five ideas everything rests on',
 concepts:[
  concept('🎯','Grain — what one row means',
   `<p class="lead"><b>Grain is the most important word in this entire project.</b> If you remember one idea from today, remember this one — every other mistake we cover is, underneath, a grain mistake.</p>
    <p><b>Definition.</b> The grain of a table is the answer to one question: <i>"what does a single row represent?"</i> — stated as one precise noun. Look at how different these are:</p>
    <ul>
      <li>"One row is one <b>lead</b>."</li>
      <li>"One row is one <b>lead entering one stage</b>."</li>
      <li>"One row is one <b>channel on one day</b>."</li>
    </ul>
    <p>Those are three different grains, and the differences are not academic — they decide whether your numbers are true.</p>
    <h3 class="sub-h">An analogy you already know</h3>
    <p>Think of any spreadsheet you have ever built. Before you typed a single row, you knew — without saying it out loud — what a row <i>was</i>: one expense, one student, one order. That silent knowledge is the grain. A database only differs in one way: unlike your spreadsheet, it will happily let you mix two grains in a single calculation and then hand you a confident, wrong answer with no warning.</p>
    <h3 class="sub-h">Watch a fuzzy grain destroy a number</h3>
    <p>Suppose you believe your events table is "one row per lead." It is actually "one row per lead per stage." Here is lead #5 in that table:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>event_id</th><th>lead_id</th><th>stage</th><th>event_at</th></tr>
      <tr><td>101</td><td>5</td><td>created</td><td>Mar 1</td></tr>
      <tr><td>102</td><td>5</td><td>mql</td><td>Mar 4</td></tr>
      <tr><td>103</td><td>5</td><td>sql</td><td>Mar 15</td></tr>
    </table></div>
    <p>You run <code class="inline">COUNT(*)</code> to "count leads." For this one lead you get <b>3</b>. Across your file you proudly report <b>6,000 leads</b> when there are only 2,000. Your VP asks why leads tripled overnight. Nothing errored. It was valid SQL. You counted the wrong thing because you were wrong about what a row <i>is</i>.</p>
    <p>The right way to count leads <i>from this table</i> is <code class="inline">COUNT(DISTINCT lead_id)</code> — precisely because the grain is per-event, not per-lead. <b>You cannot know which to write until you know the grain.</b></p>
    <h3 class="sub-h">The grain test — run it on every table you touch</h3>
    <p>Before you trust any table, finish this sentence aloud: <i>"One row in this table is exactly one ______."</i> If you can't fill the blank with one clean noun, you don't understand the table yet — and every total you build on it is a guess wearing a lab coat.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"The first thing I pin down for any table is its grain — what one row represents — because grain decides whether a COUNT counts what I think, and whether a JOIN will fan out. Most silent data bugs are grain bugs."</p>`)}`),

  concept('💥','Fan-out — the silent inflator',
   `<p>Fan-out is what happens when you <b>join two tables of different grain and then add something up.</b> The join multiplies rows, so your sum is multiplied too. No error is raised — the total is just quietly, hugely wrong.</p>
    ${diagram('fanout','A single $500 spend row, matched to 4 leads, gets counted 4 times.')}
    <h3 class="sub-h">Watch the money triple</h3>
    <p>You want "total spend per channel." You join <code class="inline">spend</code> (grain: one row per channel per day) to <code class="inline">leads</code> (grain: many leads per channel) and sum the amount. Here is what the join actually builds for one $500 Google spend row:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>spend row</th><th>joined lead</th><th>amount counted</th></tr>
      <tr><td>google · $500</td><td>lead 1</td><td>$500</td></tr>
      <tr><td>google · $500</td><td>lead 2</td><td>$500</td></tr>
      <tr><td>google · $500</td><td>lead 3</td><td>$500</td></tr>
      <tr><td>google · $500</td><td>lead 4</td><td>$500</td></tr>
    </table></div>
    <p>One $500 row became <b>$2,000</b> because Google had four leads that day. With hundreds of leads per channel, your "total spend" comes back hundreds of times too big. The number looks impressive. It is fiction.</p>
    <h3 class="sub-h">How to catch it, and how to prevent it</h3>
    <p><b>Catch it:</b> before summing after a join, run <code class="inline">COUNT(*)</code> on the joined result. If it's larger than the number of rows in either original table, you've fanned out. Also: sanity-check the total against a known truth (<code class="inline">SELECT SUM(amount) FROM spend</code>). If they disagree by a wild multiple, you fanned out.</p>
    <p><b>Prevent it:</b> never join two fact tables of different grain and then aggregate. Instead <b>aggregate each side to a common grain first, then join the summaries.</b> You'll do exactly this in Module 7. Write it on a sticky note: <i>aggregate, then join — never join, then aggregate across grains.</i></p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"Whenever I join tables of different grain, I ask whether the join could duplicate rows. If it can, I aggregate to a shared grain before joining, because otherwise every SUM downstream is inflated and nothing warns me."</p>`)}`),

  concept('🕒','Store events, not current state',
   `<p>Here is the tempting shortcut: give each lead a <code class="inline">current_stage</code> column and update it as the lead moves. It feels efficient. <b>It quietly throws away your most valuable data.</b></p>
    <p>The moment you overwrite <code class="inline">mql</code> with <code class="inline">sql</code> in that column, you have erased <i>when</i> the lead was an MQL, and whether it was ever an MQL at all. And almost every question worth asking about a funnel is a question about <i>when</i>.</p>
    ${diagram('events')}
    <h3 class="sub-h">The questions a current_stage column can never answer</h3>
    <ul>
      <li>How long does MQL → SQL take on average? <i>(needs both timestamps)</i></li>
      <li>How did leads created in March convert compared to April? <i>(needs the created date preserved)</i></li>
      <li>How many leads are stuck in "SQL" and for how long? <i>(needs the SQL-entry time)</i></li>
      <li>What did our funnel look like on June 1st? <i>(needs history, which was overwritten)</i></li>
    </ul>
    <p>An events table answers all four. A <code class="inline">current_stage</code> column answers none — the history it would need was destroyed on every update.</p>
    <h3 class="sub-h">The principle: store what you can't rebuild, derive what you can</h3>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Fact</th><th>Store or derive?</th><th>Why</th></tr>
      <tr><td>"Lead 5 entered SQL on Mar 15"</td><td><b>Store</b> (an event)</td><td>Once lost, it can never be reconstructed.</td></tr>
      <tr><td>"Lead 5's current stage"</td><td><b>Derive</b></td><td>It's just the lead's latest event — computable any time.</td></tr>
    </table></div>
    <p>Current state is always the <i>latest event</i>, so you never need to store it. You need the events, and the events give you the state for free.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"I model the funnel as an event log, not a status column. Events are append-only and preserve the full timeline, so I can reconstruct the state at any date and measure durations. A current-stage column would overwrite exactly the history the analysis needs."</p>`)}`),

  concept('✂️','Censoring — the trap that fools smart people',
   `<p>A record is <b>censored</b> when the event you're trying to measure <i>hasn't happened yet.</i> A lead sitting in "SQL" today has no "closed" date — not because it failed, but because it isn't finished.</p>
    ${diagram('censoring')}
    <h3 class="sub-h">Watch a careful analyst report a wrong number</h3>
    <p>Your VP asks: "On average, how long does it take a lead to close?" You compute it by subtracting each lead's created date from its closed date. Here are five leads today:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Lead</th><th>Created</th><th>Closed?</th><th>Days to close</th></tr>
      <tr><td>A</td><td>Jan 1</td><td>Jan 21</td><td>20</td></tr>
      <tr><td>B</td><td>Jan 5</td><td>Feb 14</td><td>40</td></tr>
      <tr><td>C</td><td>Mar 1</td><td>still open</td><td>— (no date to subtract)</td></tr>
      <tr><td>D</td><td>Apr 1</td><td>still open</td><td>— (no date to subtract)</td></tr>
      <tr><td>E</td><td>May 1</td><td>still open</td><td>— (no date to subtract)</td></tr>
    </table></div>
    <p>The subtraction only works for A and B, so your query silently uses only those two: <b>(20 + 40) / 2 = 30 days.</b> You report "we close in about 30 days."</p>
    <p>But look what you excluded: C, D, and E — the three leads that have <i>already</i> been open longer and are dragging on. Your "30 days" is computed only over the leads that closed <b>fast enough to have closed at all.</b> Reality is slower, and you have <b>understated it</b> — and dropped the exact stuck leads that made the VP ask the question.</p>
    <h3 class="sub-h">The honest fix is not a different average — it's a reframe</h3>
    <p>Two moves rescue you: (1) always state the population — "average among leads that have <i>closed</i>," and report how many are still open. (2) To compare fairly, fix a <b>window</b>: "of leads created in January, what share closed <i>within 90 days</i>?" Every lead gets the same 90-day chance, so nobody is silently dropped. You'll build exactly this in Module 6.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"Any duration or conversion metric has to account for censoring — records that haven't reached the outcome yet. If I subtract timestamps naively, I silently exclude in-flight records and bias the result toward the fast ones. I fix it with a fixed measurement window so every record is judged over the same horizon."</p>`)}`),

  concept('🧩','Lead ≠ Contact ≠ Customer ≠ Account',
   `<p>These four words get used interchangeably in casual conversation, and interviewers test the distinction within the first five minutes because it reveals whether you actually think about data or just repeat marketing slogans.</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Word</th><th>What it is</th><th>Watch out for</th></tr>
      <tr><td><b>Lead</b></td><td>A raw hand-raise — someone filled a form, downloaded something.</td><td>Might be junk, a bot, or a duplicate of someone you already know.</td></tr>
      <tr><td><b>Contact</b></td><td>A known, de-duplicated person you can actually reach.</td><td>One contact may have generated several leads over time.</td></tr>
      <tr><td><b>Customer</b></td><td>Someone who has paid.</td><td>It's a <i>state a contact reaches</i>, not a separate table or species.</td></tr>
      <tr><td><b>Account</b></td><td>The <i>company</i>, not the person.</td><td>One account holds many contacts — a whole buying committee.</td></tr>
    </table></div>
    <h3 class="sub-h">Why this is a counting problem, not a vocabulary quiz</h3>
    <p>Say the same human, Priya at Acme Corp, downloaded two whitepapers and later attended a webinar under a slightly different email. Your raw data now has <b>three leads</b>. If you count leads, Acme looks like three prospects. If you resolve identity, it's <b>one contact</b> at <b>one account</b>. "We generated 3,000 leads" and "we reached 1,100 companies" can describe the exact same reality — and they lead to different budgets.</p>
    <p>This is called <b>identity resolution</b>: the same human (or company) can exist many times across your systems, and someone has to decide when two records are "the same." For this project we keep it simple — one lead = one row — but you should be able to name the issue, because it's the first thing that breaks when marketing data meets sales data.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"Lead, contact, customer, and account sit at four different grains. Before I report any count I ask which one the question means, because 'we got 500 leads' and 'we won 500 customers' differ by orders of magnitude — and duplicates across systems make even the lead count a judgment call."</p>`)}`)
 ],
 body:`
  <p class="lead">Don't skip this module or skim it. Every mistake in funnel analytics is a modeling mistake wearing a SQL costume. Nail the model here and the SQL in later modules becomes almost mechanical — you'll be typing out decisions you already made.</p>
  <h2 class="sec">The business story we're modeling</h2>
  <p>Picture a mid-size B2B software company — call it <b>Northwind</b>. Northwind spends money every day on four <b>channels</b>: Google Ads, LinkedIn, a webinar program, and organic search. That spend produces <b>leads</b> — people who raised a hand. Leads then move through a <b>funnel</b>, and at each step most of them drop away:</p>
  ${diagram('funnel','Leads enter at the top; a fraction survives each stage. The narrowing is the story.')}
  <p>The stages, in plain English:</p>
  <ul>
    <li><b>Created</b> — a lead exists. Someone filled a form.</li>
    <li><b>MQL</b> (Marketing Qualified Lead) — marketing thinks they're worth sales' time.</li>
    <li><b>SQL</b> (Sales Qualified Lead) — a salesperson agrees and takes them on.</li>
    <li><b>Opportunity</b> — a real deal with a dollar figure attached.</li>
    <li><b>Closed Won / Closed Lost</b> — they bought, or they walked.</li>
  </ul>
  <p>Three business questions drive everything we build:</p>
  <ol>
    <li><b>Where do leads leak?</b> Which stage loses the most, and is that normal or a problem?</li>
    <li><b>What does a customer cost?</b> Not a lead — a paying <i>customer</i>, per channel.</li>
    <li><b>Where should the next dollar go?</b> Which channel is still worth more spend, and which is tapped out?</li>
  </ol>
  <p>Every one of those is a trap if you don't respect grain, events, and censoring. That's why this module comes first.</p>

  <h2 class="sec">The five ideas, and how they chain together</h2>
  <p>The concept cards above aren't a random list — they're a chain. <b>Grain</b> is the foundation: know what a row means. Get grain wrong and you either miscount (thinking events are leads) or you trigger <b>fan-out</b> (joining across grains and inflating totals). <b>Events vs. state</b> is a grain decision too — it's choosing the finer, more useful grain (one row per stage-entry) over the lossy one (one row per lead with a mutable status). And that event grain is exactly what makes <b>censoring</b> visible: a stuck lead is simply a lead <i>missing</i> its later event rows. Finally, the <b>four words</b> remind you that even "how many leads" hides a grain-and-identity decision. It all comes back to: <i>what does one row mean, and am I mixing rows that mean different things?</i></p>

  ${callout('turn','Your turn — three questions to answer out loud','✍️',`<p>Don't move on until you can answer each in a sentence or two:</p><ol><li>Why is "we got 500 leads" a very different claim from "we won 500 customers"? Roughly how far apart are those numbers in a normal funnel?</li><li>You join <code class="inline">spend</code> to <code class="inline">leads</code> and your total spend comes back 200× too high. What happened, in one word — and what's the fix?</li><li>Your teammate proposes a <code class="inline">current_stage</code> column "to keep it simple." Give them the one question it can never answer.</li></ol>`)}

  ${reveal('Check your answers',`
    <ol>
      <li><b>Orders of magnitude apart.</b> If ~2% of leads become customers, 500 leads is ~10 customers — so "500 leads" and "500 customers" describe funnels that differ ~50×. Conflating them is how people accidentally promise 50× the results.</li>
      <li><b>Fan-out.</b> The join paired each spend row with many leads, so each dollar was counted once per lead. Fix: aggregate spend and leads each to one row per channel <i>first</i>, then join the summaries.</li>
      <li><b>Almost any "when" question</b> — e.g. "how long did MQL→SQL take?" or "what did the funnel look like on June 1st?" A single mutable status column keeps only the latest value and erases the timeline.</li>
    </ol>
  `)}

  ${callout('tip','Explain the whole project in 60 seconds','🎤',`<p>Practice this until it's automatic: <i>"I'm modeling a marketing funnel as three tables at three grains — leads (one row per lead), stage events (one row per lead per stage, so I keep the full timeline), and spend (one row per channel per day). From those I measure where the funnel leaks, what a customer costs by channel, and where the next dollar should go — being careful about fan-out when I join across grains, and about censoring when I measure durations on leads that haven't finished."</i></p>`)}
 `,
 checkpoint:`Without looking, you can: (1) define <b>grain</b> and give the grain of a table, (2) explain <b>fan-out</b> with the $500→$2,000 example and its fix, (3) list a question a <code class="inline">current_stage</code> column can't answer, (4) walk through how <b>censoring</b> biases a naïve "days to close," and (5) distinguish lead / contact / customer / account. If any one is shaky, re-read that card — this module is the spine of every interview answer.`
},

{num:'2',title:'Design the three tables',time:'75 min',tag:'The heart of the project',
 concepts:[
  concept('📐','Dimension tables vs. fact tables',
   `<p>Analysts sort tables into two families, and naming which is which is a fast way to sound like you know what you're doing.</p>
    <ul>
      <li>A <b>dimension</b> describes a <i>thing</i> and its fixed attributes — the <i>nouns</i> of your business. Our <code class="inline">leads</code> table is a dimension: one row per lead, holding facts about that lead that don't change (when it was created, where it came from).</li>
      <li>A <b>fact</b> table records <i>things that happen</i> — the <i>verbs</i>, usually with a timestamp and a number. Our <code class="inline">lead_stage_events</code> (a lead moved to a stage) and <code class="inline">spend</code> (we spent money on a day) are fact tables.</li>
    </ul>
    <p><b>Rule of thumb:</b> if a row answers "what <i>is</i> this?" it's a dimension; if it answers "what <i>happened</i>?" it's a fact. Facts point at dimensions (an event points at the lead it happened to). This "facts surrounded by dimensions" shape is called a <b>star schema</b> — the single most common design in analytics.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"I modeled leads as a dimension and stage-events and spend as fact tables — a small star schema. The facts carry the timestamps and measures; the dimension carries the descriptive attributes I slice by."</p>`)}`),
  concept('🗝️','Keys — and what breaks without them',
   `<p>Keys are how a database keeps its rows honest and its tables connected.</p>
    <h3 class="sub-h">Primary key — the row's unique name</h3>
    <p>A <b>primary key</b> is a column whose value is <i>unique on every row and never empty</i> — it's how you address one specific row. <code class="inline">lead_id</code> is the primary key of <code class="inline">leads</code>. If two leads could share <code class="inline">lead_id = 5</code>, then "show me lead 5" is ambiguous and every join built on it is corrupt. The primary key forbids that.</p>
    <h3 class="sub-h">Foreign key — the honest pointer</h3>
    <p>A <b>foreign key</b> is a column in one table that points at another table's primary key. In <code class="inline">lead_stage_events</code>, the <code class="inline">lead_id</code> column is a foreign key pointing back at <code class="inline">leads.lead_id</code> — it says "this event happened to <i>that</i> lead."</p>
    <p><b>Here's the payoff.</b> Declare the foreign key and Postgres will <i>refuse</i> to insert an event whose <code class="inline">lead_id</code> doesn't exist in <code class="inline">leads</code>. Without it, nothing stops you loading an event for lead 9999 that was never created — a "ghost" or <b>orphan</b> row. Later you join events to leads, the orphan silently vanishes from the results, your counts are quietly short, and no error ever fires. The foreign key turns that silent data-corruption bug into a loud, immediate rejection at load time. That's <b>referential integrity</b>, and it's a phrase worth being able to say.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"Each event carries a foreign key to the lead it belongs to, so the database enforces referential integrity — I can't create an event for a lead that doesn't exist. That prevents orphan rows that would silently drop out of joins."</p>`)}`),
  concept('🔢','Data types — and why money is never a float',
   `<p>Every column has a <b>type</b> that says what kind of value it holds. Picking the right one prevents whole categories of bugs. The five you need:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Type</th><th>Holds</th><th>Example</th></tr>
      <tr><td><code class="inline">INTEGER</code></td><td>whole numbers</td><td>lead_id, clicks</td></tr>
      <tr><td><code class="inline">TEXT</code></td><td>any string</td><td>source_raw, stage</td></tr>
      <tr><td><code class="inline">TIMESTAMP</code></td><td>a date <i>and</i> time</td><td>event_at (Mar 4, 09:14)</td></tr>
      <tr><td><code class="inline">DATE</code></td><td>a day, no time</td><td>spend_date (Mar 4)</td></tr>
      <tr><td><code class="inline">NUMERIC</code></td><td>exact decimals</td><td>amount ($499.99)</td></tr>
    </table></div>
    <h3 class="sub-h">The float trap — a $0.01 that becomes a lawsuit</h3>
    <p>Computers store "floating-point" decimals (the <code class="inline">FLOAT</code>/<code class="inline">REAL</code> types) in binary, and many everyday amounts <i>can't be represented exactly</i> — the same way ⅓ can't be written exactly in decimal. So <code class="inline">0.1 + 0.2</code> in floating point is <code class="inline">0.30000000000000004</code>. One cent of error, times millions of rows, times a finance team, equals a very bad afternoon. That's why money uses <code class="inline">NUMERIC</code> (also called <code class="inline">DECIMAL</code>): it stores the exact digits. <b>Rule: money and any value you'll sum for a total → <code class="inline">NUMERIC</code>, never a float.</b></p>`)
 ],
 body:`
  <p class="lead">Now you design the schema — the intellectual core of the whole project. This is what an interviewer will probe hardest, because it's where judgment shows. Resist peeking at the reference: the struggle of deciding where each column belongs <i>is</i> the education. When you can defend your schema, you can defend the project.</p>

  <h2 class="sec">From story to tables</h2>
  <p>Reread the Northwind story from Module 1. Three <i>kinds</i> of fact live in it, and each becomes a table:</p>
  <ol>
    <li><b>Who the leads are</b> and where each came from — fixed facts about a lead. → a <b>dimension</b>.</li>
    <li><b>What happened to each lead over time</b> — funnel movements. → a <b>fact</b> table of events.</li>
    <li><b>What we spent</b> to acquire them — money over time. → a <b>fact</b> table.</li>
  </ol>
  ${diagram('schema','The target design: one dimension (leads) and two fact tables, at three different grains.')}

  <h2 class="sec">The two questions that place every column</h2>
  <p>For any column you're tempted to add, ask two things. Together they decide, unambiguously, which table it belongs on.</p>
  <div class="tbl-wrap"><table class="data">
    <tr><th>Test</th><th>The question</th><th>What it tells you</th></tr>
    <tr><td><b>Change test</b></td><td>Does this fact ever change for a given row?</td><td>Unchanging facts about a lead (its source) live on the <b>lead</b>. Facts that change over time (its stage) are <b>events</b>.</td></tr>
    <tr><td><b>Grain test</b></td><td>Does this column stay true for every row at this table's grain — or would it force me to repeat/duplicate data?</td><td>If a column would repeat the same value across many rows, it probably belongs on a different (coarser-grained) table.</td></tr>
  </table></div>
  <p><b>Worked application — where does "stage" go?</b> Change test: a lead's stage changes constantly (created → mql → sql…). Fails "unchanging," so it is <i>not</i> a fixed attribute of the lead — it's an event. Put it on <code class="inline">leads</code> and you're back to the doomed <code class="inline">current_stage</code> column from Module 1. Put it on the events table as a value in a <code class="inline">stage</code> column, and the timeline survives. The test <i>decides</i> for you.</p>
  <p><b>Worked application — where does "spend" go?</b> Grain test: <code class="inline">leads</code> is one row per lead, but spend happens per <i>channel per day</i>, independent of any single lead. To put a spend number on a lead you'd have to invent one, and it would break the day a channel spent money but produced zero leads. So spend needs its own table at its own grain. Cost-per-lead is then a <b>ratio you compute</b> by rolling both tables to a common grain — never a stored column.</p>

  ${callout('turn','Your turn — design all three before reading on','✍️',`<p>On paper, for <b>each</b> table write: (1) "one row = one ______" (the grain), (2) every column and <i>why it belongs here and not elsewhere</i> (name the test that decides it), (3) the primary key, (4) any foreign key. Spend real time here. Then — and only then — open the reference and compare your <i>reasoning</i>, not just your column list.</p>`)}

  ${callout('tip','The casing trap — design it in on purpose','💡',`<p>Real CRM data is filthy: the same channel arrives as <code class="inline">Google</code>, <code class="inline">google</code>, <code class="inline">GOOGLE</code>, <code class="inline">Google Ads</code>. A beginner "cleans" it on the way in and loses the evidence. The professional move is to store the <b>raw</b> source exactly as it arrived (<code class="inline">source_raw</code>) and normalize it <i>at query time</i>, so the original is never lost. We'll dirty it deliberately in the generator (Module 3) so you get practice cleaning it (Module 5).</p>`)}

  ${reveal('Reveal the reference three-table design + full per-column reasoning',`
    <p>This is <i>a</i> strong design, not the only one. If yours differs but survives the change test and grain test, it may be just as defensible — comparing reasoning is the whole point.</p>
    <h3 class="sub-h">leads — the dimension (grain: one row per lead)</h3>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Column</th><th>Role</th><th>Why it belongs here</th></tr>
      <tr><td><code class="inline">lead_id</code></td><td>Primary key</td><td>Uniquely names the lead so events can point back to it.</td></tr>
      <tr><td><code class="inline">created_at</code></td><td>attribute</td><td>When the lead first appeared — a fixed fact (change test).</td></tr>
      <tr><td><code class="inline">source_raw</code></td><td>attribute</td><td>The channel as it arrived, uncleaned. Fixed fact; kept raw on purpose.</td></tr>
      <tr><td><code class="inline">campaign</code></td><td>attribute</td><td>Which campaign produced it. Fixed. Nullable — some leads have none.</td></tr>
      <tr><td><code class="inline">region</code></td><td>attribute</td><td>Geography of the lead. Fixed. A second dimension to slice by.</td></tr>
    </table></div>
    <p><b>Deliberately absent:</b> <code class="inline">current_stage</code> (fails the change test → it's an event) and any <code class="inline">spend</code> column (wrong grain).</p>

    <h3 class="sub-h">lead_stage_events — a fact table (grain: one row per lead per stage-entry)</h3>
    ${diagram('grain')}
    <div class="tbl-wrap"><table class="data">
      <tr><th>Column</th><th>Role</th><th>Why it belongs here</th></tr>
      <tr><td><code class="inline">event_id</code></td><td>Primary key</td><td>Names each individual event.</td></tr>
      <tr><td><code class="inline">lead_id</code></td><td>Foreign key → leads</td><td>Which lead this happened to; enforces referential integrity.</td></tr>
      <tr><td><code class="inline">stage</code></td><td>the measure</td><td>A <i>value</i> (created/mql/sql/opportunity/closed_won/closed_lost), never a separate table.</td></tr>
      <tr><td><code class="inline">event_at</code></td><td>timestamp</td><td>When this stage was entered — the column that makes durations and cohorts possible.</td></tr>
    </table></div>
    <p><b>How censoring lives here:</b> a lead stuck in SQL simply has <b>no</b> closed_won/closed_lost row. The <i>absence</i> of the row is the censoring — there's nothing to "mark," which is exactly why naïve averages miss it.</p>

    <h3 class="sub-h">spend — a fact table (grain: one row per channel per day)</h3>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Column</th><th>Role</th><th>Why it belongs here</th></tr>
      <tr><td><code class="inline">spend_id</code></td><td>Primary key</td><td>Names each channel-day of spend.</td></tr>
      <tr><td><code class="inline">channel</code></td><td>attribute</td><td>Stored <i>clean</i> here — you'll reconcile it against the dirty <code class="inline">source_raw</code> later.</td></tr>
      <tr><td><code class="inline">spend_date</code></td><td>the day</td><td>Spend is a per-day fact.</td></tr>
      <tr><td><code class="inline">amount</code></td><td>the measure</td><td>Dollars that day. <code class="inline">NUMERIC</code> — never a float.</td></tr>
      <tr><td><code class="inline">impressions</code>, <code class="inline">clicks</code></td><td>optional measures</td><td>Enable richer efficiency metrics (click-through, cost-per-click).</td></tr>
    </table></div>
    <p><b>The relationships in one breath:</b> <code class="inline">lead_stage_events.lead_id</code> → <code class="inline">leads.lead_id</code> (many events per lead). <code class="inline">spend.channel</code> relates to <code class="inline">leads.source_raw</code> only <i>after</i> you normalize and aggregate — they're different grains and must never be joined row-to-row (that's the fan-out from Module 1).</p>
  `)}

  ${callout('turn','Your turn — write the CREATE TABLE statements','✍️',`<p>A <code class="inline">CREATE TABLE</code> statement names the table, lists its columns, and gives each column a <b>type</b> (from the data-types card above). Write all three yourself, adding <code class="inline">PRIMARY KEY</code>, <code class="inline">NOT NULL</code>, and the foreign key where they belong. Hit a syntax wall? Look up that one specific piece — don't copy the whole block.</p>`)}
  ${reveal('Reveal reference DDL — with every clause explained',`
    ${code('sql',`CREATE TABLE leads (
    lead_id     INTEGER PRIMARY KEY,   -- unique + not null
    created_at  TIMESTAMP NOT NULL,
    source_raw  TEXT NOT NULL,         -- channel as it arrived, un-cleaned
    campaign    TEXT,                  -- nullable: some leads have none
    region      TEXT
);

CREATE TABLE lead_stage_events (
    event_id  INTEGER PRIMARY KEY,
    lead_id   INTEGER NOT NULL REFERENCES leads(lead_id),  -- FK
    stage     TEXT NOT NULL,
    event_at  TIMESTAMP NOT NULL
);

CREATE TABLE spend (
    spend_id     INTEGER PRIMARY KEY,
    channel      TEXT NOT NULL,
    spend_date   DATE NOT NULL,
    amount       NUMERIC(10,2) NOT NULL,  -- money: exact decimal, never float
    impressions  INTEGER,
    clicks       INTEGER
);`)}
    <ul>
      <li><b>PRIMARY KEY</b> — guarantees unique + never null; how a single row is addressed.</li>
      <li><b>NOT NULL</b> — the column is required; used for facts that must always exist.</li>
      <li><b>REFERENCES leads(lead_id)</b> — a foreign key; Postgres now <i>refuses</i> an event pointing at a lead that doesn't exist.</li>
      <li><b>NUMERIC(10,2)</b> — exact decimal for money. Never store money as floating point; rounding errors compound.</li>
      <li><b>campaign/region are nullable</b> — real leads sometimes lack them; forcing a value would mean fabricating data.</li>
    </ul>
  `)}
 `,
 checkpoint:`Three empty tables exist. You can state the grain of each in one sentence and justify why each column sits where it sits — and why <code class="inline">current_stage</code> and a per-lead spend column do <b>not</b> exist.`
},

{num:'3',title:'Generate the data',time:'75 min',tag:'Build realistic fake data',
 concepts:[
  concept('🎲','Why generate your own data',
   `<p>You don't have a real CRM, and even if you did you couldn't share it. So you'll <b>generate synthetic data</b> — fake rows that behave like real ones. This is not a compromise; it's a superpower.</p>
    <h3 class="sub-h">You get to control the truth</h3>
    <p>When you <i>build</i> the data, you decide the real conversion rates and delays. Then you write queries and check whether they <i>recover</i> the numbers you planted. If you built webinar to convert at 8% and your query later reports ~8%, your query is trustworthy. With real data you never get this luxury — there's no answer key. Here, you write the answer key first.</p>
    <h3 class="sub-h">It's a real portfolio skill</h3>
    <p>"Where did your data come from?" is the first question anyone asks about a project. "I generated it with a documented, seeded Python script that models a realistic funnel, including censoring and dirty source data" is a <i>far</i> stronger answer than "I downloaded a clean CSV from Kaggle." You're demonstrating that you understand what makes data realistic — which is exactly the judgment an analyst is hired for.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"The data is synthetic, generated by a seeded script I wrote. That let me plant known conversion rates and then verify my SQL recovered them — and deliberately build in messy real-world features like censored records and inconsistent channel spellings."</p>`)}`),
  concept('🪙','The funnel as a chain of weighted coin flips',
   `<p>How do you make "60% of leads become MQLs" happen in code? With a <b>weighted coin flip.</b> The computer can produce a random number between 0 and 1. If you want something to happen 60% of the time, you flip: "is the random number below 0.60?" Below → it happens; above → it doesn't. Over thousands of leads, ~60% land below.</p>
    <p>The funnel is just this flip repeated <b>down a chain</b>. A lead only gets a shot at the SQL flip if it already passed the MQL flip:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Stage flip</th><th>Passes if random &lt;</th><th>Of 2,000 leads, ~how many reach it</th></tr>
      <tr><td>Created → MQL</td><td>0.55</td><td>~1,100</td></tr>
      <tr><td>MQL → SQL</td><td>0.45</td><td>~495</td></tr>
      <tr><td>SQL → Opportunity</td><td>0.40</td><td>~198</td></tr>
      <tr><td>Opportunity → Won</td><td>0.30</td><td>~59</td></tr>
    </table></div>
    <p>Notice how the survivors shrink fast — that's <b>multiplying probabilities</b>: 0.55 × 0.45 × 0.40 × 0.30 ≈ 3%. Only ~3% of leads become customers, which is exactly why "leads" and "customers" differ by orders of magnitude (Module 1). <b>Channel quality</b> tilts every coin: a webinar lead with quality 1.8 flips against 0.55 × 1.8 ≈ 0.95 at the first stage — much likelier to advance.</p>`),
  concept('⏳','Why the delays are exponential (and why it matters)',
   `<p>Real leads don't all take the same time to advance. Most move quickly; a long tail drags on for weeks. That shape — lots of small values, a few large ones — is an <b>exponential distribution</b>, and the generator uses <code class="inline">random.expovariate</code> to produce it.</p>
    <p><b>Why you should care as an analyst:</b> when data is skewed like this, the <b>mean is pulled up by the long tail</b> and no longer represents a typical lead. The average time-to-close might be 45 days while the <i>typical</i> (median) lead closes in 30. Reporting the mean alone would overstate how long things usually take. Building the skew in yourself means you'll <i>see</i> mean ≠ median in your own results and understand why — instead of being surprised by it in an interview.</p>
    <p>It also interacts with censoring: because later stages take longer, recently-created leads are the <i>most</i> likely to still be mid-funnel when you take your snapshot. The delays and the censoring are two sides of the same realism.</p>`)
 ],
 body:`
  <p class="lead">Empty tables teach nothing. A generator you understand line-by-line teaches everything — because you'll know exactly what's in the data, which is what makes your later analysis defensible. Before writing any code, decide how you'll produce each piece of realism, and know <i>why each one matters</i>:</p>
  <div class="tbl-wrap"><table class="data">
    <tr><th>Realism feature</th><th>What it means</th><th>Why it matters later</th></tr>
    <tr><td>Leaky funnel</td><td>Each stage passes only a fraction forward.</td><td>Creates the drop-off you measure in Module 5.</td></tr>
    <tr><td>Channel-varying quality</td><td>Channels convert at different rates.</td><td>Makes cost-per-customer differ from cost-per-lead (Module 7).</td></tr>
    <tr><td>Time spread</td><td>Leads arrive across Jan–Jul.</td><td>Creates cohorts to compare (Module 6).</td></tr>
    <tr><td>Realistic delays</td><td>Later stages take longer.</td><td>Makes duration analysis meaningful; creates skew.</td></tr>
    <tr><td>Censoring</td><td>Recent leads haven't finished the funnel.</td><td>The whole judgment trap in Module 6 depends on this.</td></tr>
    <tr><td>Dirty source casing</td><td>Same channel, many spellings.</td><td>Forces the normalization skill in Module 5.</td></tr>
    <tr><td>Spend per channel-day</td><td>Money set independently of leads.</td><td>The different-grain problem, made physical (Module 7).</td></tr>
  </table></div>

  <h2 class="sec">Plan the algorithm in plain English first</h2>
  <p>Never open a code editor with a blank mind. Write the logic as sentences, then translate. Here's the shape — try to write your own version before reading this one:</p>
  ${callout('tip','The algorithm, in words','📝',`<p>For each of 2,000 leads: pick a random <b>created date</b> between Jan 1 and today. Pick a <b>channel</b> (weighted, so Google is common and webinar rare). Pick a messy <b>spelling</b> of that channel. Record the lead, and emit its <code class="inline">created</code> event. Then walk the funnel: flip the MQL coin — if it passes, add a random delay and emit an <code class="inline">mql</code> event; <b>but if that event's date lands after today, stop and emit nothing</b> (the lead is censored). Repeat for SQL, Opportunity, and finally Won/Lost. Separately, for every channel on every day, record a spend amount.</p>`)}

  <h2 class="sec">The only Python you need — a short primer</h2>
  <p>You'll use a handful of ideas. Here's each with a tiny example; ask for more on any one:</p>
  <div class="tbl-wrap"><table class="data">
    <tr><th>Idea</th><th>What it does</th><th>Example</th></tr>
    <tr><td>Variable</td><td>stores a value</td><td><code class="inline">n_leads = 2000</code></td></tr>
    <tr><td>List</td><td>holds many values</td><td><code class="inline">names = ["google","linkedin"]</code></td></tr>
    <tr><td>Loop</td><td>repeats a block</td><td><code class="inline">for i in range(2000):</code></td></tr>
    <tr><td>Random flip</td><td>0–1 number to compare</td><td><code class="inline">if random.random() &lt; 0.55:</code></td></tr>
    <tr><td>Weighted pick</td><td>choose with odds</td><td><code class="inline">random.choices(names, weights=w)</code></td></tr>
    <tr><td>Date math</td><td>add days to a date</td><td><code class="inline">start + timedelta(days=3)</code></td></tr>
  </table></div>
  ${callout('warn','The #1 beginner error','⚠️',`<p>Python uses <b>indentation</b> (leading spaces) to show what's inside a loop or an <code class="inline">if</code>. Misaligned spaces cause <code class="inline">IndentationError</code>. Keep everything inside a block indented by the same amount (4 spaces is standard), and never mix tabs and spaces.</p>`)}
  <p>One more idea worth naming: <code class="inline">random.seed(42)</code> at the top makes the "random" data come out <b>identical every run</b>. That's <b>reproducibility</b> — anyone who runs your script gets your exact numbers, so your results aren't a fluke of one lucky run. Interviewers love this.</p>

  ${callout('turn','Your turn — write generate_data.py','✍️',`<p>Produce three CSV files matching your three grains. Expect errors — that's normal. Read the <b>last line</b> of any error: it names the file, the line number, and what went wrong. Fix that one line. Bring me the error message, not a request to write the script for you. Run it with <code class="inline">python3 generate_data.py</code>.</p>`)}
  ${reveal('Reveal reference generator — heavily commented',`
    <p>Study the comments; they explain <i>why</i>, which is what you'll be asked about. Tune the numbers — owning them is part of owning the project.</p>
    ${code('python',`import csv, random
from datetime import datetime, timedelta

random.seed(42)   # same "random" data every run -> reproducible

N_LEADS = 2000
START = datetime(2025, 1, 1)
TODAY = datetime(2025, 7, 24)          # anything after this is the future
DAYS = (TODAY - START).days

# channels differ in VOLUME (weight) and QUALITY (multiplier)
channels = {
  "google":   {"weight":40,"quality":1.0,"spell":["google","Google","Google Ads","GOOGLE"]},
  "linkedin": {"weight":25,"quality":1.4,"spell":["linkedin","LinkedIn","Linkedin"]},
  "webinar":  {"weight":15,"quality":1.8,"spell":["webinar","Webinar","WEBINAR"]},
  "organic":  {"weight":20,"quality":0.7,"spell":["organic","Organic","organic search"]},
}
names = list(channels)
weights = [channels[c]["weight"] for c in names]

BASE = {"mql":0.55,"sql":0.45,"opp":0.40,"won":0.30}   # the "truth"
DELAY = {"mql":3,"sql":10,"opp":25,"closed":45}        # later stages take longer

leads, events = [], []
eid = 1
for lid in range(1, N_LEADS+1):
    created = START + timedelta(days=random.randint(0,DAYS), hours=random.randint(0,23))
    ch = random.choices(names, weights=weights)[0]
    src = random.choice(channels[ch]["spell"])   # the dirt
    q = channels[ch]["quality"]
    leads.append([lid, created.isoformat(), src,
                  f"campaign_{random.randint(1,6)}",
                  random.choice(["NA","EMEA","APAC"])])

    def emit(stage, when):
        global eid
        if when > TODAY:          # CENSORING: future events don't exist yet
            return False
        events.append([eid, lid, stage, when.isoformat()]); eid += 1
        return True

    emit("created", created)
    t = created
    if random.random() < min(BASE["mql"]*q, 0.95):
        t += timedelta(days=random.expovariate(1/DELAY["mql"]))
        if not emit("mql", t): continue
        if random.random() < min(BASE["sql"]*q, 0.95):
            t += timedelta(days=random.expovariate(1/DELAY["sql"]))
            if not emit("sql", t): continue
            if random.random() < min(BASE["opp"]*q, 0.95):
                t += timedelta(days=random.expovariate(1/DELAY["opp"]))
                if not emit("opportunity", t): continue
                t += timedelta(days=random.expovariate(1/DELAY["closed"]))
                emit("closed_won" if random.random() < min(BASE["won"]*q,0.95) else "closed_lost", t)

# SPEND: its own loop, its own grain (channel x day)
spend = []; sid = 1; day = START
budget = {"google":500,"linkedin":350,"webinar":150,"organic":40}
while day <= TODAY:
    for ch in names:
        amt = round(budget[ch]*random.uniform(0.7,1.3), 2)
        imp = int(amt*random.uniform(80,120)); clk = int(imp*random.uniform(0.01,0.04))
        spend.append([sid, ch, day.date().isoformat(), amt, imp, clk]); sid += 1
    day += timedelta(days=1)

def write(name, header, rows):
    with open(name,"w",newline="") as f:
        w = csv.writer(f); w.writerow(header); w.writerows(rows)
write("leads.csv", ["lead_id","created_at","source_raw","campaign","region"], leads)
write("lead_stage_events.csv", ["event_id","lead_id","stage","event_at"], events)
write("spend.csv", ["spend_id","channel","spend_date","amount","impressions","clicks"], spend)
print(f"Wrote {len(leads)} leads, {len(events)} events, {len(spend)} spend rows.")`)}
    <p>Worth being able to explain: <b>expovariate</b> gives delays that cluster small with a long tail (realistic, and why your duration averages skew); the <b>if when &gt; TODAY</b> line is the single most important one — it cuts recent leads off mid-funnel exactly like real in-flight leads; and <b>spend is a separate loop with its own grain</b>.</p>
  `)}
 `,
 checkpoint:`Three CSV files exist. You can open <code class="inline">leads.csv</code> and see messy source spellings, and explain which line creates the censoring.`
},

{num:'4',title:'Load the data',time:'30 min',tag:'CSVs into Postgres',
 concepts:[
  concept('📄','What a CSV actually is',
   `<p>A <b>CSV</b> (Comma-Separated Values) is the simplest possible data file: plain text, one row per line, columns separated by commas. The first line is usually the <b>header</b> — the column names. Open <code class="inline">leads.csv</code> in any text editor and you'll see exactly this:</p>
    ${code('bash','lead_id,created_at,source_raw,campaign,region\n1,2025-03-04T09:14:00,Google Ads,campaign_3,EMEA\n2,2025-01-22T16:02:00,linkedin,campaign_1,NA','A CSV is just text: a header line, then one line per row')}
    <p>Every spreadsheet and database can read and write CSVs, which is why it's the universal way to move tabular data between tools. Your generator wrote three of them; now you'll pour them into Postgres.</p>`),
  concept('📥','COPY — bulk-load a CSV into a table',
   `<p>Postgres's <code class="inline">COPY</code> command reads a CSV and inserts every row into a table in one fast operation — far faster than inserting rows one at a time. It matches CSV columns to table columns <b>by position</b> (first CSV column → first listed table column), which is why the order you name the columns must match the order in the file. Yours match by design, so it "just works."</p>
    <p>There are two flavors, and knowing the difference saves a classic beginner headache:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th></th><th><code class="inline">COPY</code></th><th><code class="inline">\\copy</code></th></tr>
      <tr><td>Who reads the file</td><td>the Postgres <b>server</b></td><td><b>you</b> (the psql client)</td></tr>
      <tr><td>Needs file permissions for</td><td>the server process</td><td>your own user</td></tr>
      <tr><td>Fails when</td><td>the server can't reach your file</td><td>rarely — it reads as you</td></tr>
    </table></div>
    <p>If <code class="inline">COPY</code> throws a permissions error, switch to <code class="inline">\\copy</code> (same syntax) and run it from the folder holding the CSVs. It reads the file with <i>your</i> permissions, so it almost always works.</p>`)
 ],
 body:`
  <p class="lead">Three CSV files are sitting in your project folder. This module pours them into the three tables you built in Module 2. It's short — but there's one ordering rule that trips people up, and it's a direct consequence of the foreign key you declared.</p>

  ${callout('warn','Load leads BEFORE events — the ordering rule','⚠️',`<p>Remember the foreign key: every row in <code class="inline">lead_stage_events</code> points at a <code class="inline">lead_id</code> that must exist in <code class="inline">leads</code>. If you load the events <i>first</i>, Postgres checks each event against a still-empty leads table, finds no matching lead, and <b>rejects every row</b>. Load <code class="inline">leads</code> first, then the events have real leads to point at. (This is referential integrity from Module 2 doing its job — the "error" is the database protecting you.) Spend has no foreign key, so it can go anytime.</p>`)}

  ${callout('turn','Your turn — load all three','✍️',`<p>Look up <code class="inline">COPY … FROM … WITH (FORMAT csv, HEADER)</code> and load each file. You'll need each file's <b>absolute path</b> — run <code class="inline">pwd</code> in the folder with your CSVs to get it. Load <b>leads first</b>. Try it before opening the reference.</p>`)}
  ${reveal('Reveal reference load commands',`
    ${code('sql',`-- Run inside psql. Replace /FULL/PATH/ with the output of pwd.
COPY leads (lead_id, created_at, source_raw, campaign, region)
FROM '/FULL/PATH/leads.csv' WITH (FORMAT csv, HEADER true);

COPY lead_stage_events (event_id, lead_id, stage, event_at)
FROM '/FULL/PATH/lead_stage_events.csv' WITH (FORMAT csv, HEADER true);

COPY spend (spend_id, channel, spend_date, amount, impressions, clicks)
FROM '/FULL/PATH/spend.csv' WITH (FORMAT csv, HEADER true);`)}
    <p><b>Permissions error?</b> Server-side <code class="inline">COPY</code> needs Postgres itself to read the file. The always-works fix is psql's client-side <code class="inline">\\copy</code> (same syntax, reads the file as you), run from the folder holding the CSVs.</p>
  `)}
  ${callout('turn','Your turn — verify','✍️',`<p>Write three <code class="inline">SELECT COUNT(*) FROM …;</code> queries and confirm the counts match your generator's printout. Then eyeball ten rows: <code class="inline">SELECT * FROM leads LIMIT 10;</code></p>`)}
 `,
 checkpoint:`All three tables are populated, counts match the generator, and a <code class="inline">SELECT</code> returns real rows.`
},

{num:'5',title:'First funnel queries',time:'80 min',tag:'Learn SQL by answering real questions',
 concepts:[
  concept('🧱','The shape of every SQL query',
   `<p>Almost every query you'll ever write fits one skeleton. Learn it once and SQL stops being intimidating — you're just filling in blanks.</p>
    ${code('sql',`SELECT   columns / calculations   -- 5. what to show\nFROM     table                    -- 1. start here\nJOIN     other ON ...             -- 2. attach related rows\nWHERE    row filter               -- 3. keep some rows\nGROUP BY columns                  -- 4. collapse into groups\nORDER BY columns                  -- 6. sort the result`)}
    <h3 class="sub-h">You write it in one order, the database runs it in another</h3>
    <p>You <i>type</i> SELECT first, but Postgres <i>executes</i> roughly: <b>FROM</b> (get the rows) → <b>WHERE</b> (filter rows) → <b>GROUP BY</b> (collapse into groups) → <b>SELECT</b> (compute what to show) → <b>ORDER BY</b> (sort). The numbers in the comments above show the real order. This one fact explains most beginner confusion — e.g. why you can't always use a column nickname from SELECT inside WHERE (WHERE runs before SELECT, so the nickname doesn't exist yet).</p>`),
  concept('➗','Aggregation — collapsing many rows into one',
   `<p>The magic verb in analytics is <b>GROUP BY</b>. It takes many rows and collapses them into one row <i>per group</i>, and an <b>aggregate function</b> summarizes each group into a single number.</p>
    <p>Picture 2,000 lead rows. <code class="inline">GROUP BY channel</code> sorts them into four piles (google, linkedin, webinar, organic), and <code class="inline">COUNT(*)</code> counts each pile — you get four rows out. The aggregate functions you'll use:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Function</th><th>Answers</th></tr>
      <tr><td><code class="inline">COUNT(*)</code></td><td>how many rows in this group?</td></tr>
      <tr><td><code class="inline">COUNT(DISTINCT x)</code></td><td>how many <i>different</i> values of x?</td></tr>
      <tr><td><code class="inline">SUM(x)</code></td><td>add up x across the group</td></tr>
      <tr><td><code class="inline">AVG(x)</code></td><td>the average of x</td></tr>
    </table></div>
    <p><b>Why <code class="inline">COUNT(*)</code> and <code class="inline">COUNT(DISTINCT lead_id)</code> can differ wildly:</b> in your events table one lead has several rows, so <code class="inline">COUNT(*)</code> counts <i>events</i> while <code class="inline">COUNT(DISTINCT lead_id)</code> counts <i>leads</i>. This is the grain lesson from Module 1 showing up in actual syntax. When someone asks "how many leads reached SQL," you want distinct leads, not event rows.</p>`),
  concept('🔠','Normalize before you group',
   `<p>Here's the casing trap from Module 2, now live. Your <code class="inline">source_raw</code> column holds <code class="inline">google</code>, <code class="inline">Google</code>, <code class="inline">GOOGLE</code>, <code class="inline">Google Ads</code> — four spellings of one channel. Run <code class="inline">GROUP BY source_raw</code> and Postgres treats each spelling as a separate group, so Google fractures into four rows and every per-channel number is wrong.</p>
    <p>The fix is to <b>normalize</b> — collapse the spellings into one clean channel — <i>before</i> grouping. <code class="inline">LOWER()</code> handles the casing (<code class="inline">GOOGLE</code> → <code class="inline">google</code>); a <code class="inline">CASE</code> expression handles the rest (<code class="inline">google ads</code> → <code class="inline">google</code>). Normalizing before grouping is the judgment that separates an analyst from someone who can merely type SQL — and you should say out loud that you're doing it, and why.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"Before I group by any source or category field, I normalize it — casing and known aliases — because raw CRM values fracture the same channel into several groups and quietly corrupt every downstream rate."</p>`)}`),
  concept('🧮','Integer division — the silent zero',
   `<p>A conversion <i>rate</i> is a division: leads that reached SQL ÷ leads that reached MQL. But SQL has a trap: dividing two <b>integers</b> gives an integer, throwing away the decimal. So <code class="inline">495 / 1100</code> returns <code class="inline">0</code>, not <code class="inline">0.45</code> — your rate silently becomes zero and the query still "works."</p>
    <p>The fix is to make one side a decimal by <b>casting</b>: <code class="inline">495::numeric / 1100</code> gives <code class="inline">0.45</code>. The <code class="inline">::numeric</code> tells Postgres "treat this as an exact decimal." Any time you divide counts to get a rate, cast the top — every time, reflexively.</p>`)
 ],
 body:`
  <p class="lead">Now you learn SQL the way you'll actually use it — by answering real business questions, one at a time. Each question below introduces a little new syntax. Follow one habit religiously: <b>predict the answer before you run the query.</b> When the result doesn't match your prediction, you've either learned something about the data or caught a bug — both are wins. Analysts who skip this step ship wrong-but-plausible numbers.</p>
  ${callout('turn','Your turn — leads by channel (the casing trap is live)','✍️',`<p>Run it the naïve way first and <i>see</i> the fracture; then fix it. You'll need <code class="inline">COUNT(*)</code>, <code class="inline">GROUP BY</code>, and a way to unify spellings.</p>`)}
  ${reveal('Reveal — the naïve version, why it\'s wrong, and the fix',`
    <p><b>Naïve (wrong)</b> — returns separate rows for <code class="inline">google</code>, <code class="inline">Google</code>, <code class="inline">GOOGLE</code>, <code class="inline">Google Ads</code>:</p>
    ${code('sql',`SELECT source_raw, COUNT(*) AS lead_count
FROM leads
GROUP BY source_raw
ORDER BY lead_count DESC;`)}
    <p><b>The fix</b> — map every dirty spelling to one clean channel with <code class="inline">CASE</code>:</p>
    ${code('sql',`SELECT
  CASE
    WHEN LOWER(source_raw) LIKE 'google%'   THEN 'google'
    WHEN LOWER(source_raw) LIKE 'linkedin%' THEN 'linkedin'
    WHEN LOWER(source_raw) LIKE 'webinar%'  THEN 'webinar'
    WHEN LOWER(source_raw) LIKE 'organic%'  THEN 'organic'
    ELSE 'other'
  END AS channel,
  COUNT(*) AS lead_count
FROM leads
GROUP BY 1          -- "1" = group by the first SELECT expression
ORDER BY lead_count DESC;`)}
    <p><code class="inline">CASE…END</code> is SQL's if/else; <code class="inline">LIKE 'google%'</code> matches anything starting with "google" (so it catches "google ads" too).</p>
  `)}
  ${callout('turn','Your turn — funnel stage counts','✍️',`<p>One number per stage: how many <i>distinct leads</i> ever entered it. You're counting leads, not events — use <code class="inline">COUNT(DISTINCT lead_id)</code>. Predict the order first: if SQL outnumbers MQL, something is impossible.</p>`)}
  ${reveal('Reveal — stage counts',`
    ${code('sql',`SELECT stage, COUNT(DISTINCT lead_id) AS leads_reaching_stage
FROM lead_stage_events
GROUP BY stage
ORDER BY leads_reaching_stage DESC;`)}
    <p><code class="inline">COUNT(DISTINCT lead_id)</code> counts unique leads — a safety belt against double-counting.</p>
  `)}
  ${callout('turn','Your turn — stage-to-stage conversion rates','✍️',`<p>A rate is the insight. Watch the integer-division gotcha: <code class="inline">5/2</code> is <code class="inline">2</code> in SQL unless one side is decimal.</p>`)}
  ${reveal('Reveal — conversion rates with the division fix',`
    ${code('sql',`SELECT
  COUNT(DISTINCT lead_id) FILTER (WHERE stage='mql')::numeric
    / COUNT(DISTINCT lead_id) FILTER (WHERE stage='created') AS created_to_mql,
  COUNT(DISTINCT lead_id) FILTER (WHERE stage='sql')::numeric
    / COUNT(DISTINCT lead_id) FILTER (WHERE stage='mql')     AS mql_to_sql,
  COUNT(DISTINCT lead_id) FILTER (WHERE stage='opportunity')::numeric
    / COUNT(DISTINCT lead_id) FILTER (WHERE stage='sql')     AS sql_to_opp
FROM lead_stage_events;`)}
    <p><code class="inline">FILTER (WHERE …)</code> counts only rows meeting a condition — several stage counts in one pass. <code class="inline">::numeric</code> casts the top of the fraction to decimal so it isn't integer division. These recovered rates should land near the <code class="inline">BASE</code> rates you built into the generator.</p>
  `)}
 `,
 checkpoint:`You can produce clean per-channel lead counts, funnel stage counts, and conversion rates — and explain the normalization and the <code class="inline">::numeric</code> cast.`
},

{num:'6',title:'The judgment traps',time:'2 hrs',tag:'The interview centerpiece',
 concepts:[
  concept('✂️','Censored averages — the trap that biases duration',
   `<p>You met censoring in Module 1; here's how it ambushes a specific, common metric: "how long does a lead take to close?"</p>
    <h3 class="sub-h">The mechanism, step by step</h3>
    <p>You compute it by subtracting each lead's created date from its closed date. But an in-flight lead has <b>no closed date</b> — so the subtraction produces nothing, and that lead is <b>silently dropped</b> from the average. Your result is computed only over leads that <i>have already closed</i>.</p>
    <p><b>Which direction does it lie?</b> Always toward "faster than reality." The leads that closed are disproportionately the <i>fast</i> ones; the slow, stuck leads are exactly the ones still open and therefore excluded. So your "30-day average" understates the true time — and it drops the very stuck leads that made your VP ask the question in the first place.</p>
    <h3 class="sub-h">The fix isn't a cleverer AVG — it's a reframe</h3>
    <p>Two honest moves: (1) <b>state the population</b> — "average <i>among leads that have closed</i>" — and report how many are still open alongside it. (2) To compare across time, switch to a <b>fixed window</b>: "of January's leads, what share closed within 90 days?" Every lead then gets the same 90-day chance, so nobody is silently excluded.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"A naïve time-to-close average is biased low because it only sees leads that already closed — it censors the slow, in-flight ones. I'd report it with its population and open-count, and for comparisons use a fixed-window conversion rate so every record is judged over the same horizon."</p>`)}`),
  concept('🎓','Cohort attribution & maturity',
   `<p>"What's our conversion rate?" hides a choice about <b>which month gets the credit</b> for a win.</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Approach</th><th>Credits the win to…</th><th>Good for</th></tr>
      <tr><td>Conversion-date</td><td>the month it <i>closed</i></td><td>"what did we book this month?"</td></tr>
      <tr><td><b>Cohort (created-date)</b></td><td>the month the lead was <i>created</i></td><td>judging acquisition — it lines the win up with the spend that caused it</td></tr>
    </table></div>
    <p>To judge a channel you want <b>cohort</b> attribution, because the money was spent when the lead was created, not when it happened to close months later.</p>
    <h3 class="sub-h">The maturity trap</h3>
    <p>But deals here take ~45+ days. A cohort created <i>last week</i> physically cannot have closed yet. If you compare last week's raw conversion to January's, the recent cohort looks catastrophic — not because it's worse, but because it's <b>young</b>. You'd "discover" a crisis that is really just the calendar.</p>
    ${diagram('cohort')}
    <p><b>The fix: fix the window, don't freeze the number.</b> Measure every cohort at the <i>same age</i> — "share that closed within 90 days of creation" — and exclude cohorts too young to have had their 90 days. Now differences are real signal, not maturity artifacts.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"I attribute conversions to the created cohort so they line up with acquisition spend, and I always measure cohorts at a fixed age — a 90-day conversion rate — so I'm not comparing a mature cohort to one that simply hasn't had time to convert."</p>`)}`),
  concept('🔮','Predictive metrics & drift',
   `<p>Because young cohorts are censored, you can <i>estimate</i> where they'll land. Take a <b>mature</b> cohort's known 90-day conversion rate and apply it to a young cohort's current volume:</p>
    ${code('sql',"projected_wins(June) = size_of_June_cohort × mature_90day_won_rate")}
    <p>If June brought 300 leads and mature cohorts convert at 3%, you project ~9 eventual customers from June — a forecast you can put in front of leadership <i>while clearly labeling it a forecast</i>.</p>
    <h3 class="sub-h">The one assumption that makes or breaks it</h3>
    <p><b>No drift.</b> Borrowing the mature rate only works if the conditions that produced it still hold — same channel mix, same product, same pricing, same sales motion. If you just ran a discount or changed your ad targeting, the old rate is invalid and your forecast is fiction. <b>Always name this assumption out loud</b> when you present a projection; an unlabeled forecast presented as fact is how analysts lose credibility.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"I can project a young cohort's outcome by applying a mature cohort's conversion rate to its current volume — as long as I flag the no-drift assumption, that acquisition and sales conditions haven't changed since the mature cohort was created."</p>`)}`)
 ],
 body:`
  <p class="lead">This module is the reason the project is worth doing — it's what turns "someone who can write SQL" into "an analyst." Anyone can <code class="inline">GROUP BY</code>. The analyst is the person who <i>refuses to report the naïve number</i> and can explain exactly why it's wrong. For each trap below you'll do the same three-step drill: <b>(1)</b> compute the tempting-but-wrong version, <b>(2)</b> see precisely why it lies, <b>(3)</b> produce the honest version. Being able to <i>demonstrate</i> all three — wrong query, diagnosis, fix — is the single most impressive thing you can show in an interview.</p>
  <h3 class="sub-h">Trap 1 — "How long does it take to close?"</h3>
  ${callout('turn','Your turn (the wrong way first)','✍️',`<p>Compute average days from <code class="inline">created</code> to <code class="inline">closed_won</code> by subtracting timestamps (a self-join of the events table). Then ask: <b>which leads are in this average, and which silently fell out?</b></p>`)}
  ${reveal('Reveal — the naïve duration, why it lies, and the honest framing',`
    ${code('sql',`SELECT AVG(EXTRACT(EPOCH FROM (won.event_at - c.event_at))/86400) AS avg_days
FROM lead_stage_events c
JOIN lead_stage_events won
  ON won.lead_id = c.lead_id AND won.stage = 'closed_won'
WHERE c.stage = 'created';`)}
    <p><b>Why it lies:</b> the JOIN keeps only leads that <i>have</i> a <code class="inline">closed_won</code> row. Every in-flight lead is silently excluded, so this "average" is computed only over already-closed (fast, old) leads. It understates reality and ignores exactly the stuck leads that motivate the question.</p>
    <p><b>The honest response is a reframe:</b> state the population ("mean time to close <i>among leads that have closed</i>"), report how many that is vs. still open, and to compare fairly use a fixed window — "of January's leads, what share closed <i>within 90 days</i>?" — so every lead gets the same chance.</p>
  `)}
  <h3 class="sub-h">Trap 2 — the join that inflates every total</h3>
  ${callout('turn','Your turn','✍️',`<p>Try "total spend and total leads per channel" by joining <code class="inline">leads</code> to <code class="inline">spend</code> and summing. Predict the spend total, then compare to the true <code class="inline">SELECT SUM(amount) FROM spend;</code></p>`)}
  ${reveal('Reveal — watch the total explode, and why',`
    ${code('sql',`SELECT s.channel, SUM(s.amount) AS total_spend, COUNT(*) AS n
FROM spend s
JOIN leads l ON l.source_raw ILIKE s.channel || '%'
GROUP BY s.channel;`)}
    <p>The <code class="inline">SUM(s.amount)</code> here will be <b>hundreds of times</b> the real total. <b>Why:</b> spend has one row per channel-day; leads has many leads per channel. The join pairs every spend row with every matching lead, so each dollar is counted once per lead. <b>The fix is a mindset:</b> aggregate each side to a common grain <i>first</i>, then join the summaries. (You do exactly that in Module 7.)</p>
  `)}
  <h3 class="sub-h">Trap 3 — cohorts and maturity</h3>
  ${callout('turn','Your turn','✍️',`<p>Group leads by created-month; for each cohort compute the share that closed won. Then spot the flaw and fix it by fixing the window.</p>`)}
  ${reveal('Reveal — cohort conversion, the maturity flaw, and the fix',`
    ${code('sql',`SELECT date_trunc('month', l.created_at) AS cohort_month,
       COUNT(DISTINCT l.lead_id) AS cohort_size,
       COUNT(DISTINCT won.lead_id)::numeric
         / COUNT(DISTINCT l.lead_id) AS won_rate
FROM leads l
LEFT JOIN lead_stage_events won
  ON won.lead_id = l.lead_id AND won.stage = 'closed_won'
GROUP BY 1 ORDER BY 1;`)}
    <p><code class="inline">LEFT JOIN</code> keeps every lead even if it never won (an inner join would drop the non-winners and destroy the denominator — a devastating, silent bug). <b>The flaw:</b> recent cohorts show a collapsing rate only because they haven't had <i>time</i> to close. <b>The fix</b> — measure at the same age and only include cohorts old enough:</p>
    ${code('sql',`... LEFT JOIN lead_stage_events won
      ON won.lead_id = l.lead_id
     AND won.stage = 'closed_won'
     AND won.event_at <= l.created_at + INTERVAL '90 days'
WHERE l.created_at <= DATE '2025-07-24' - INTERVAL '90 days'`)}
    <p>Now every included cohort has had a full 90-day chance. Quote it as the "90-day closed-won rate," never a bare "conversion rate."</p>
  `)}
 `,
 checkpoint:`You can <i>demonstrate</i> each trap — run the wrong query, explain precisely what it miscounts, and produce the honest version. This is your interview centerpiece.`
},

{num:'7',title:'Cost & spend analysis',time:'90 min',tag:'Where the grain lessons pay off',
 concepts:[
  concept('🧮','Every cost metric is a cross-grain ratio',
   `<p>Here every lesson about grain pays off in real dollars. Notice what "cost per lead" and "cost per customer" actually are:</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Metric</th><th>Formula</th><th>Comes from</th></tr>
      <tr><td>Cost per lead</td><td>spend ÷ leads</td><td>two tables of different grain</td></tr>
      <tr><td>Cost per customer</td><td>spend ÷ customers</td><td>two tables of different grain</td></tr>
    </table></div>
    <p>They are <b>ratios</b>, never stored columns — and the numerator (spend, per channel-day) and denominator (leads, per lead) live at <i>different grains</i>. Divide them naïvely with a join and you get fan-out (Module 1): the total explodes. The safe recipe is always the same three steps: <b>(1)</b> roll spend up to one row per channel, <b>(2)</b> roll leads up to one row per channel, <b>(3)</b> join those two summaries — now at the <i>same</i> grain — and divide. Aggregate first, then join.</p>`),
  concept('🗂️','CTEs — named building blocks with WITH',
   `<p>A <b>CTE</b> ("Common Table Expression," written <code class="inline">WITH name AS (…)</code>) is a named temporary result you define at the top of a query and then use below like a table. It's how you do "aggregate first, then join" cleanly.</p>
    ${code('sql',"WITH spend_by_channel AS (\n  SELECT channel, SUM(amount) AS total_spend\n  FROM spend GROUP BY channel\n)\nSELECT * FROM spend_by_channel;   -- use it like a table")}
    <p>Think of each CTE as a labeled bowl of prepped ingredients: you make <code class="inline">spend_by_channel</code> (one row per channel) and <code class="inline">leads_by_channel</code> (one row per channel) separately, then combine them. It reads top-to-bottom like a recipe, and — crucially — it forces both sides to a shared grain <i>before</i> they ever meet, which is exactly what prevents fan-out.</p>`),
  concept('📉','Marginal vs. average cost — the number that drives decisions',
   `<p>This is the most sophisticated idea in the project, and the one that most impresses interviewers because it separates description from decision.</p>
    <ul>
      <li><b>Average</b> cost per customer tells you <i>how you did</i>: total spend ÷ total customers.</li>
      <li><b>Marginal</b> cost tells you <i>what to do next</i>: what did the <i>most recent</i> customers cost?</li>
    </ul>
    <p><b>Why they differ:</b> the eager buyers convert cheaply; as you spend more on a channel, you reach a worse audience — fence-sitters who cost more to convert. So the next customer always costs more than the average so far.</p>
    <h3 class="sub-h">Worked example</h3>
    <p>Say LinkedIn's first \$10k won 100 customers (avg \$100 each). You double spend to \$20k and win only 150 total — the second \$10k bought just 50 customers, so those <b>marginal</b> customers cost \$200 each. The average ((\$20k/150) ≈ \$133) looks fine; the margin (\$200) is the truth about your next dollar.</p>
    <p><b>The decision rule:</b> keep spending on a channel until its <i>marginal</i> cost per customer reaches the <i>value</i> of a customer — not until the average looks bad. And a rising average usually means <b>spend less, not kill the channel</b>: you'd throw away the cheap early customers too.</p>
    ${callout('tip','Say it like this in an interview','🎙️',`<p>"Average cost per customer scores the past; marginal cost drives the next decision. Because extra spend reaches a worse audience, marginal cost exceeds average. I'd fund each channel up to where its marginal cost equals customer value — and read a rising average as a signal to pull back, not to cut the channel."</p>`)}`)
 ],
 body:`
  <p class="lead">Everything about grain, fan-out, and aggregate-then-join now converts into dollars-and-cents decisions. This is where the modeling discipline earns its keep: because you respect grain, your cost numbers are trustworthy — and because you understand marginal vs. average, you can turn those numbers into a recommendation a CFO would accept.</p>
  ${callout('turn','Your turn — cost per lead, done right','✍️',`<p>Use two <b>CTEs</b> (from the concept above): build spend-per-channel and leads-per-channel separately (normalizing the dirty source!), then join those summaries and divide. Predict which channel is most expensive per lead before you run it.</p>`)}
  ${reveal('Reveal — cost per lead via aggregate-then-join',`
    ${code('sql',`WITH spend_by_channel AS (        -- grain: one row per channel
  SELECT channel, SUM(amount) AS total_spend
  FROM spend GROUP BY channel
),
leads_by_channel AS (             -- grain: one row per channel (normalized!)
  SELECT
    CASE
      WHEN LOWER(source_raw) LIKE 'google%'   THEN 'google'
      WHEN LOWER(source_raw) LIKE 'linkedin%' THEN 'linkedin'
      WHEN LOWER(source_raw) LIKE 'webinar%'  THEN 'webinar'
      WHEN LOWER(source_raw) LIKE 'organic%'  THEN 'organic'
      ELSE 'other'
    END AS channel,
    COUNT(*) AS lead_count
  FROM leads GROUP BY 1
)
SELECT s.channel, s.total_spend, l.lead_count,
       ROUND(s.total_spend / l.lead_count, 2) AS cost_per_lead
FROM spend_by_channel s
JOIN leads_by_channel l ON l.channel = s.channel
ORDER BY cost_per_lead DESC;`)}
    <p>Each CTE collapses its table to <b>one row per channel</b> — a shared grain. Only then do we join, so one spend total meets one lead count. No fan-out.</p>
  `)}
  ${callout('turn','Your turn — cost per customer','✍️',`<p>Replace "leads per channel" with "closed-won <i>customers</i> per channel". Predict: will webinar's cost <i>per customer</i> be relatively better or worse than its cost <i>per lead</i>? (Recall you built webinar to convert at higher quality.)</p>`)}
  ${reveal('Reveal — cost per customer and the interpretation',`

function downloadNotes(fmt){
